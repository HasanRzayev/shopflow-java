services:
  - type: web
    name: shopflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: shopflow-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: shopflow-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: shopflow-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: shopflow-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: shopflow-postgres
          property: password

databases:
  - name: shopflow-postgres
    plan: free
    databaseName: shopflow_db
    user: postgres
